name: Release Vault Ethereum Signer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Extract tag from git ref
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build linux arm64 binary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags='-w -s -extldflags "-static"' -a -o vault-eth-signer-${TAG} cmd/plugin/*.go

      - name: Generate checksum
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          shasum -a 256 vault-eth-signer-${TAG} > vault-eth-signer-${TAG}.sha256

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          generate_release_notes: true
          files: |
            vault-eth-signer-${{ steps.tag.outputs.tag }}
            vault-eth-signer-${{ steps.tag.outputs.tag }}.sha256
